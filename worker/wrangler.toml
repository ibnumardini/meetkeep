name = "meetkeep-analytics"
main = "function/index.js"
compatibility_date = "2024-01-01"

[triggers]
# Cloudflare Cron uses UTC; 17:00 UTC is 00:00 WIB.
crons = ["0 17 * * *"]

# Set secrets via CLI, not here:
#   wrangler secret put GA_MEASUREMENT_ID
#   wrangler secret put GA_API_SECRET
#   wrangler secret put GA_SERVICE_ACCOUNT_JSON   (full service account JSON key, single line)
#   wrangler secret put GA_PROPERTY_ID             (numeric GA4 property id, e.g. 123456789)
